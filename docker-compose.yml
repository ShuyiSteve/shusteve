# Local / development stack.
# Usage: copy .env.example to .env, then `docker compose up -d`
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-shusteve}
      MYSQL_USER: ${DB_USER:-shusteve}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shusteve_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "8080"
      GIN_MODE: release
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-shusteve}
      DB_PASSWORD: ${DB_PASSWORD:-shusteve_password}
      DB_NAME: ${DB_NAME:-shusteve}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      TOKEN_TTL_HOURS: "72"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shusteve.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: "10"
      SEED_DATA: "true"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-}
        VITE_YOUTUBE_URL: ${VITE_YOUTUBE_URL:-}
        VITE_EMAIL: ${VITE_EMAIL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mysql_data:
  uploads_data:
