# Production Nginx config.
#
# This is a single host Nginx in front of your containers:
#   * serves the built React app (static files)
#   * proxies /api and /uploads to the Go backend on 127.0.0.1:8080
#   * redirects HTTP -> HTTPS and terminates TLS (certbot-managed certificates)
#
# Replace shusteve.com with your real domain and run:
#   sudo certbot --nginx -d shusteve.com -d www.shusteve.com
#
# Then reload: sudo nginx -t && sudo systemctl reload nginx

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name shusteve.com www.shusteve.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shusteve.com www.shusteve.com;

    ssl_certificate     /etc/letsencrypt/live/shusteve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shusteve.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/shusteve;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1h;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
